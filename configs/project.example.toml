[project]
report_dir = "../outputs"
data_dir = "../data"
coverage_days = 7
signal_limit = 12
idea_limit = 24
headlines_per_idea = 3

[llm]
enabled = false
provider = "openai_responses"
model = "gpt-4.1-mini"
api_key_env = "OPENAI_API_KEY"
api_base_url = "https://api.openai.com/v1/responses"
timeout_seconds = 45

[airtable]
enabled = false
api_token_env = "AIRTABLE_TOKEN"
base_id = "appXXXXXXXXXXXXXX"
report_link_field = "Document URL"
report_link_poll_attempts = 8
report_link_poll_interval_seconds = 2.0
report_record_url_template = "https://airtable.com/{base_id}/{table_id}/{record_id}"

  [airtable.tables]
  reports = "Reports"
  raw_signals = "Inforeasons"
  angles = "Angles"
  headlines = "Headlines"
  recommendations = "Recommendations"
  risks = "Risks"

  [airtable.table_ids]
  reports = "tblXXXXXXXXXXXXXX"

[[geo]]
id = "latam-demo"
name = "Chile"
owner = "LATAM Team Lead"
offer_name = "Финансовый оффер"
offer_description = "Нативные маркетинговые углы вокруг защиты бюджета, дополнительного дохода и недоверия к банковским комиссиям."
previous_report_url = ""
report_language = "ru"
audience_pains = [
  "страх, что зарплата снова не покроет месяц",
  "ощущение, что банки и комиссии съедают остаток денег",
  "желание иметь запасной доход на фоне нестабильности",
]
offer_hooks = [
  "переводим новость в разговор о защите семейного бюджета",
  "заходим через поиск запасного источника денег без ложных обещаний",
  "подчеркиваем, что аудитории нужен понятный контроль над личными финансами",
]
evergreen_themes = [
  "маленькие пенсии и рост цен",
  "комиссии банков и неожиданные списания",
  "страх потерять накопления из-за инфляции",
]

  [[geo.source]]
  kind = "local_rss"
  name = "Demo LATAM feed"
  source_type = "локальный таблоид"
  category = "экономика"
  path = "../tests/fixtures/sample_feed.xml"
  max_items = 10

  [[geo.source]]
  kind = "google_news_rss"
  name = "Google News Chile Economy"
  source_type = "топовое СМИ"
  category = "экономика"
  query = "Chile inflation taxes salaries banks protests"
  language = "en-US"
  country = "US"
  max_items = 10
